                </button>
              </div>
            </div>
          </div>
        `;

        document.getElementById('ex-name').addEventListener('input', (e) => { ex.config.examName = e.target.value; });
        document.getElementById('ex-subject').addEventListener('change', (e) => { ex.config.subject = e.target.value; ex.config.topics = []; renderApp(); });
        document.getElementById('ex-all-topics')?.addEventListener('click', () => { ex.config.topics = []; renderApp(); });
        document.getElementById('ex-clear-topics')?.addEventListener('click', () => { ex.config.topics = []; renderApp(); });
        main.querySelectorAll('.ex-topic-pill').forEach((btn) => {
          btn.addEventListener('click', () => {
            const t = btn.dataset.exTopic;
            if (ex.config.topics.includes(t)) ex.config.topics = ex.config.topics.filter((x) => x !== t);
            else ex.config.topics = [...ex.config.topics, t];
            renderApp();
          });
        });
        document.getElementById('ex-qcount').addEventListener('input', (e) => { ex.config.questionCount = Math.max(1, Number(e.target.value) || 1); });
        document.getElementById('ex-duration').addEventListener('input', (e) => { ex.config.durationMinutes = Math.max(1, Number(e.target.value) || 1); });
        document.getElementById('ex-pos').addEventListener('input', (e) => { ex.config.positiveMarks = Math.max(0.5, Number(e.target.value) || 1); });
        document.getElementById('ex-neg').addEventListener('input', (e) => { ex.config.negativeMarks = Math.max(0, Number(e.target.value) || 0); });

        document.getElementById('ex-start-btn').addEventListener('click', () => {
          const shuffled = [...pool].sort(() => Math.random() - 0.5);
          const count = Math.min(Math.max(1, ex.config.questionCount), shuffled.length);
          ex.questions = shuffled.slice(0, count);
          ex.currentIndex = 0;
          ex.responses = {};
          ex.statuses = {};
          ex.questions.forEach((_, i) => { ex.statuses[i] = i === 0 ? 'not_answered' : 'not_visited'; });
          ex.remainingSeconds = ex.config.durationMinutes * 60;
          ex.startTime = Date.now();
          ex.phase = 'running';

          clearExamTimer();
          ex.timerId = setInterval(() => {
            ex.remainingSeconds--;
            const timerEl = document.getElementById('cbt-timer');
            if (timerEl) {
              timerEl.textContent = formatTimer(Math.max(0, ex.remainingSeconds));
              if (ex.remainingSeconds <= 60) timerEl.classList.add('text-rose-600', 'animate-pulse');
            }
            if (ex.remainingSeconds <= 0) {
              showToast('Time is up! Exam auto-submitted.', 'warning');
              finalizeExam();
            }
          }, 1000);

          renderApp();
        });
        return;
      }

      // Phase 2: Standard CBT Running Interface
      if (ex.phase === 'running') {
        const idx = ex.currentIndex;
        const q = ex.questions[idx];
        const selected = ex.responses[idx];

        const counts = { not_visited: 0, not_answered: 0, answered: 0, marked: 0, answered_marked: 0 };
        ex.questions.forEach((_, i) => { counts[ex.statuses[i] || 'not_visited']++; });

        const paletteBtnStyle = (st, isCurr) => {
          const ring = isCurr ? 'ring-2 ring-offset-1 ring-indigo-600' : '';
          if (st === 'answered') return `bg-emerald-600 text-white border-emerald-600 ${ring}`;
          if (st === 'not_answered') return `bg-rose-500 text-white border-rose-500 ${ring}`;
          if (st === 'marked') return `bg-purple-600 text-white border-purple-600 ${ring}`;
          if (st === 'answered_marked') return `bg-purple-600 text-white border-purple-600 relative ${ring}`;
          return `bg-slate-200 text-slate-700 border-slate-300 ${ring}`;
        };

        main.innerHTML = `
          <div class="space-y-4 fade-in">
            <!-- CBT Top Bar -->
            <div class="bg-slate-900 text-white rounded-2xl px-5 py-3.5 flex flex-wrap items-center justify-between gap-3 shadow-sm">
              <div>
                <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Online Mock Test</div>
                <div class="font-bold text-base">${escapeHtml(ex.config.examName || 'Mock Test')}</div>
              </div>
              <div class="flex items-center gap-4">
                <div class="text-right">
                  <div class="text-[11px] text-slate-400">Time Remaining</div>
                  <div id="cbt-timer" class="font-mono text-lg font-bold ${ex.remainingSeconds <= 60 ? 'text-rose-400' : 'text-emerald-400'}">${formatTimer(ex.remainingSeconds)}</div>
                </div>
                <button id="cbt-submit-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white">Submit Exam</button>
              </div>
            </div>

            <!-- CBT Split Layout -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
              <!-- Left: Question Area -->
              <div class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 shadow-2xs overflow-hidden">
                <div class="px-5 py-3 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-sm text-slate-900">Question ${idx + 1} of ${ex.questions.length}</span>
                    <span class="text-xs px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 font-medium">${escapeHtml(q.subject)} • ${escapeHtml(q.topic)}</span>
                  </div>
                  <div class="text-xs font-medium text-slate-600">
                    <span class="text-emerald-700">+${ex.config.positiveMarks}</span> / <span class="text-rose-600">-${ex.config.negativeMarks}</span>
                  </div>
                </div>

                <div class="p-6 space-y-5">
                  <div class="text-base text-slate-900 font-medium">${renderRichText(q.questionText)}</div>
                  ${q.imageData ? `
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl inline-block">
                      <img src="${q.imageData}" alt="Question diagram" class="max-h-60 max-w-full rounded object-contain" />
                    </div>
                  ` : ''}

                  <div class="space-y-2.5">
                    ${q.options.map((opt, oIdx) => {
                      const isSel = selected === oIdx;
                      return `
                        <button data-cbt-opt="${oIdx}" class="cbt-opt-btn w-full text-left flex items-start gap-3 p-3.5 rounded-xl border transition-all ${isSel ? 'border-indigo-600 bg-indigo-50/70 ring-2 ring-indigo-100' : 'border-slate-200 hover:bg-slate-50'}">
                          <span class="w-6 h-6 rounded-full border flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${isSel ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 text-slate-600'}">${optionLetter(oIdx)}</span>
                          <div class="flex-1 min-w-0 text-sm">${renderRichText(opt)}</div>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>

                <!-- CBT Bottom Action Bar -->
                <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2.5">
                  <div class="flex flex-wrap items-center gap-2">
                    <button id="cbt-clear" class="px-3.5 py-2 rounded-lg text-xs font-semibold border border-slate-300 bg-white text-slate-700 hover:bg-slate-100">Clear Response</button>
                    <button id="cbt-mark-next" class="px-3.5 py-2 rounded-lg text-xs font-semibold bg-purple-600 hover:bg-purple-700 text-white">Mark for Review &amp; Next</button>
                  </div>
                  <div class="flex items-center gap-2">
                    <button id="cbt-prev" ${idx === 0 ? 'disabled' : ''} class="px-3.5 py-2 rounded-lg text-xs font-semibold border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-40">Previous</button>
                    <button id="cbt-save-next" class="px-4 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">Save &amp; Next</button>
                  </div>
                </div>
              </div>

              <!-- Right: Question Palette -->
              <div class="lg:col-span-4 bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs space-y-4">
                <h3 class="font-bold text-sm text-slate-900">Question Palette</h3>

                <!-- Legend -->
                <div class="grid grid-cols-2 gap-2 text-xs text-slate-600">
                  <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-emerald-600 inline-block"></span> Answered (<span id="cbt-cnt-ans">${counts.answered}</span>)</div>
                  <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-rose-500 inline-block"></span> Not Answered (<span id="cbt-cnt-notans">${counts.not_answered}</span>)</div>
                  <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-slate-200 border border-slate-300 inline-block"></span> Not Visited (<span id="cbt-cnt-notvis">${counts.not_visited}</span>)</div>
                  <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-purple-600 inline-block"></span> Marked (<span id="cbt-cnt-marked">${counts.marked + counts.answered_marked}</span>)</div>
                </div>

                <!-- Grid -->
                <div class="pt-3 border-t border-slate-100 grid grid-cols-5 gap-2">
                  ${ex.questions.map((_, i) => {
                    const st = ex.statuses[i] || 'not_visited';
                    return `
                      <button data-jump="${i}" class="cbt-jump-btn h-10 rounded-lg border font-bold text-xs flex items-center justify-center transition-all ${paletteBtnStyle(st, i === idx)}">
                        ${i + 1}
                        ${st === 'answered_marked' ? '<span class="w-2 h-2 rounded-full bg-emerald-400 absolute top-1 right-1"></span>' : ''}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          </div>
        `;

        function goToQuestion(targetIdx) {
          ex.currentIndex = targetIdx;
          if (ex.statuses[targetIdx] === 'not_visited') {
            ex.statuses[targetIdx] = 'not_answered';
          }
          renderApp();
        }

        function syncCbtOptionAndPaletteInPlace() {
          const curSel = ex.responses[idx];
          main.querySelectorAll('.cbt-opt-btn').forEach((b) => {
            const isSel = Number(b.dataset.cbtOpt) === curSel;
            b.className = `cbt-opt-btn w-full text-left flex items-start gap-3 p-3.5 rounded-xl border ${
              isSel ? 'border-indigo-600 bg-indigo-50/70 ring-2 ring-indigo-100' : 'border-slate-200 hover:bg-slate-50'
            }`;
            const badge = b.querySelector('span');
            if (badge) {
              badge.className = `w-6 h-6 rounded-full border flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${
                isSel ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 text-slate-600'
              }`;
            }
          });
          const liveCounts = { not_visited: 0, not_answered: 0, answered: 0, marked: 0, answered_marked: 0 };
          ex.questions.forEach((_, i) => { liveCounts[ex.statuses[i] || 'not_visited']++; });
          const elAns = document.getElementById('cbt-cnt-ans');
          const elNotAns = document.getElementById('cbt-cnt-notans');
          const elNotVis = document.getElementById('cbt-cnt-notvis');
          const elMarked = document.getElementById('cbt-cnt-marked');
          if (elAns) elAns.textContent = liveCounts.answered;
          if (elNotAns) elNotAns.textContent = liveCounts.not_answered;
          if (elNotVis) elNotVis.textContent = liveCounts.not_visited;
          if (elMarked) elMarked.textContent = liveCounts.marked + liveCounts.answered_marked;
          const jumpBtn = main.querySelector(`.cbt-jump-btn[data-jump="${idx}"]`);
          if (jumpBtn) {
            const st = ex.statuses[idx] || 'not_visited';
            jumpBtn.className = `cbt-jump-btn h-10 rounded-lg border font-bold text-xs flex items-center justify-center ${paletteBtnStyle(st, true)}`;
            jumpBtn.innerHTML = `${idx + 1}${st === 'answered_marked' ? '<span class="w-2 h-2 rounded-full bg-emerald-400 absolute top-1 right-1"></span>' : ''}`;
          }
        }

        main.querySelectorAll('.cbt-opt-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            ex.responses[idx] = Number(btn.dataset.cbtOpt);
            ex.statuses[idx] = ex.statuses[idx] === 'marked' || ex.statuses[idx] === 'answered_marked' ? 'answered_marked' : 'answered';
            syncCbtOptionAndPaletteInPlace();
          });
        });

        document.getElementById('cbt-clear').addEventListener('click', () => {
          delete ex.responses[idx];
          ex.statuses[idx] = 'not_answered';
          syncCbtOptionAndPaletteInPlace();
        });

        document.getElementById('cbt-mark-next').addEventListener('click', () => {
          ex.statuses[idx] = ex.responses[idx] !== undefined ? 'answered_marked' : 'marked';
          goToQuestion((idx + 1) % ex.questions.length);
        });

        document.getElementById('cbt-prev').addEventListener('click', () => {
          if (idx > 0) goToQuestion(idx - 1);
        });

        document.getElementById('cbt-save-next').addEventListener('click', () => {
          if (ex.responses[idx] !== undefined) {
            ex.statuses[idx] = 'answered';
          } else {
            ex.statuses[idx] = 'not_answered';
          }
          goToQuestion((idx + 1) % ex.questions.length);
        });

        main.querySelectorAll('.cbt-jump-btn').forEach((btn) => {
          btn.addEventListener('click', () => goToQuestion(Number(btn.dataset.jump)));
        });

        document.getElementById('cbt-submit-btn').addEventListener('click', () => {
          openConfirmModal({
            title: 'Submit Mock Test?',
            message: `Answered: ${counts.answered + counts.answered_marked} | Not Answered: ${counts.not_answered} | Not Visited: ${counts.not_visited}. Ready to submit?`,
            confirmLabel: 'Submit Exam',
            danger: false,
            onConfirm: finalizeExam
          });
        });

        enhanceRenderedContent(main);
        return;
      }

      // Phase 3: Exam Result View
      const res = ex.lastResult;
      main.innerHTML = renderExamResultView(res, () => {
        ex.phase = 'setup';
        renderApp();
      });
      enhanceRenderedContent(main);
    }

    function renderExamResultView(res, onBackClick) {
      const accuracy = (res.correctCount + res.wrongCount) > 0
        ? Math.round((res.correctCount / (res.correctCount + res.wrongCount)) * 100)
        : 0;

      setTimeout(() => {
        document.getElementById('res-back-btn')?.addEventListener('click', onBackClick);
      }, 0);

      return `
        <div class="max-w-4xl mx-auto space-y-6 fade-in">
          <div class="flex items-center justify-between flex-wrap gap-3">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">${escapeHtml(res.examName)} — Results</h1>
              <p class="text-sm text-slate-500">${new Date(res.date).toLocaleString()} • Time Taken: ${formatTimer(res.timeTakenSeconds)}</p>
            </div>
            <button id="res-back-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">Done / Back</button>
          </div>

          <!-- Scorecards -->
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
            <div class="bg-white rounded-2xl border border-slate-200 p-3.5 sm:p-4 text-center flex flex-col items-center justify-center min-w-0">
              <div class="text-xs text-slate-500">Score</div>
              <div class="text-lg sm:text-xl font-bold text-indigo-600 mt-1 break-words">${res.score} / ${res.maxScore}</div>
            </div>
            <div class="bg-emerald-50 rounded-2xl border border-emerald-200 p-3.5 sm:p-4 text-center flex flex-col items-center justify-center min-w-0">
              <div class="text-xs text-emerald-700">Right</div>
              <div class="text-lg sm:text-xl font-bold text-emerald-700 mt-1">${res.correctCount}</div>
            </div>
            <div class="bg-rose-50 rounded-2xl border border-rose-200 p-3.5 sm:p-4 text-center flex flex-col items-center justify-center min-w-0">
              <div class="text-xs text-rose-700">Wrong</div>
              <div class="text-lg sm:text-xl font-bold text-rose-700 mt-1">${res.wrongCount}</div>
            </div>
            <div class="bg-slate-50 rounded-2xl border border-slate-200 p-3.5 sm:p-4 text-center flex flex-col items-center justify-center min-w-0">
              <div class="text-xs text-slate-500">Unattempted</div>
              <div class="text-lg sm:text-xl font-bold text-slate-700 mt-1">${res.unattemptedCount}</div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-3.5 sm:p-4 text-center col-span-2 sm:col-span-1 flex flex-col items-center justify-center min-w-0">
              <div class="text-xs text-slate-500">Accuracy</div>
              <div class="text-lg sm:text-xl font-bold text-slate-900 mt-1 whitespace-nowrap">${accuracy}%</div>
            </div>
          </div>

          <!-- Detailed Question Review -->
          <div class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Detailed Solution Review</h2>
            ${res.responses.map((item, i) => {
              const q = item.questionSnapshot;
              const sel = item.selectedIndex;
              const isCorrect = sel === q.correctIndex;
              const badge = sel === null
                ? '<span class="px-2 py-0.5 rounded bg-slate-200 text-slate-700 text-xs font-semibold">Unattempted</span>'
                : isCorrect
                  ? '<span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 text-xs font-semibold">Right</span>'
                  : '<span class="px-2 py-0.5 rounded bg-rose-100 text-rose-800 text-xs font-semibold">Wrong</span>';

              return `
                <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
                  <div class="flex items-center justify-between gap-2">
                    <span class="font-bold text-sm text-slate-900">Q${i + 1}. ${escapeHtml(q.subject)} (${escapeHtml(q.topic)})</span>
                    ${badge}
                  </div>
                  <div class="text-sm text-slate-900">${renderRichText(q.questionText)}</div>
                  ${q.imageData ? `<img src="${q.imageData}" alt="Diagram" class="max-h-44 rounded border border-slate-200" />` : ''}
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    ${q.options.map((opt, oIdx) => {
                      let cls = 'bg-slate-50 border-slate-200 text-slate-700';
                      if (oIdx === q.correctIndex) cls = 'bg-emerald-50 border-emerald-400 text-emerald-900 font-medium';
                      else if (oIdx === sel && !isCorrect) cls = 'bg-rose-50 border-rose-400 text-rose-900';
                      return `
                        <div class="px-3 py-2 rounded-lg border text-sm flex items-start gap-2 ${cls}">
                          <span class="font-bold text-xs mt-0.5">${optionLetter(oIdx)}.</span>
                          <div class="flex-1 min-w-0">${renderRichText(opt)}</div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                  ${q.explanation ? `
                    <div class="p-3 rounded-xl bg-amber-50/70 border border-amber-200 text-xs sm:text-sm text-slate-700">
                      <strong class="text-amber-900">Explanation:</strong>
                      <div class="mt-1">${renderRichText(q.explanation)}</div>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // PAGE 4: HISTORY PAGE (WITH SEPARATE BACKUP & RESTORE FOR EXAMS)
    // =========================================================================
    function renderHistoryPage(main) {
      if (state.historyReviewId) {
        const record = state.examHistory.find((h) => h.id === state.historyReviewId);
        if (record) {
          main.innerHTML = renderExamResultView(record, () => {
            state.historyReviewId = null;
            renderApp();
          });
          enhanceRenderedContent(main);
          return;
        }
        state.historyReviewId = null;
      }

      // Group exams by local calendar date (YYYY-MM-DD) sorted newest first
      const dateGroups = {};
      state.examHistory.forEach((h) => {
        const d = new Date(h.date);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        if (!dateGroups[key]) {
          dateGroups[key] = {
            key,
            label: d.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }),
            items: []
          };
        }
        dateGroups[key].items.push(h);
      });
      const sortedDateKeys = Object.keys(dateGroups).sort((a, b) => b.localeCompare(a));

      main.innerHTML = `
        <div class="space-y-6 fade-in">
          <!-- Aligned Header -->
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
              <div>
                <h1 class="text-2xl font-bold text-slate-900 leading-tight">Exam History</h1>
                <p class="text-sm text-slate-500 mt-0.5">${state.examHistory.length} conducted exam(s) across ${sortedDateKeys.length} date(s)</p>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              ${sortedDateKeys.length > 0 ? `
                <button id="hist-expand-all" class="px-3.5 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 inline-flex items-center gap-1.5">
                  <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
                  <span>Expand All</span>
                </button>
                <button id="hist-collapse-all" class="px-3.5 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 inline-flex items-center gap-1.5">
                  <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" /></svg>
                  <span>Wrap All</span>
                </button>
              ` : ''}
              <button id="hist-backup-btn" class="px-3.5 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 inline-flex items-center gap-1.5">
                <svg class="w-4 h-4 shrink-0 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                <span>Backup Exams</span>
              </button>
              <button id="hist-restore-btn" class="px-3.5 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 inline-flex items-center gap-1.5">
                <svg class="w-4 h-4 shrink-0 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                <span>Restore Exams</span>
              </button>
            </div>
          </div>

          ${state.examHistory.length === 0 ? `
            <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-12 text-center">
              <p class="text-slate-600 font-medium">No exams conducted yet.</p>
              <p class="text-xs text-slate-400 mt-1">Complete a mock test in Exam Mode to see your score history here.</p>
            </div>
          ` : `
            <div class="space-y-4">

    const OFFLINE_CACHE_KEY = 'examvault_offline_libs_v1';
    const OFFLINE_CACHE_NAME = 'examvault-offline-v1';
    let offlineCacheStatus = 'Checking offline cache...';

    function injectOfflineAsset(type, content) {
      if (!content) return;
      if (type === 'style') {
        const st = document.createElement('style');
        st.dataset.offlineCached = '1';
        st.textContent = content;
        document.head.appendChild(st);
      } else if (type === 'script') {
        const sc = document.createElement('script');
        sc.dataset.offlineCached = '1';
        sc.textContent = content;
        document.head.appendChild(sc);
      }
    }

    async function restoreFromOfflineStorage() {
      try {
        const raw = localStorage.getItem(OFFLINE_CACHE_KEY);
        if (!raw) return false;
        const cached = JSON.parse(raw);
        if (cached.tailwindCss) injectOfflineAsset('style', cached.tailwindCss);
        if (cached.katexCss) injectOfflineAsset('style', cached.katexCss);
        if (cached.hljsCss) injectOfflineAsset('style', cached.hljsCss);
        if (!window.katex && cached.katexJs) injectOfflineAsset('script', cached.katexJs);
        if (!window.renderMathInElement && cached.katexAutoJs) injectOfflineAsset('script', cached.katexAutoJs);
        if (!window.marked && cached.markedJs) injectOfflineAsset('script', cached.markedJs);
        if (!window.hljs && cached.hljsJs) injectOfflineAsset('script', cached.hljsJs);
        enhanceRenderedContent(document.getElementById('app-main'));
        return true;
      } catch (e) {
        return false;
      }
    }

    async function initAutoOfflinePersistence() {
      // Register sw.js if hosted on GitHub Pages / HTTPS origin
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        try {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        } catch (e) {}
      }

      if (!navigator.onLine) {
        const ok = await restoreFromOfflineStorage();
        offlineCacheStatus = ok
          ? 'Offline mode active — running from browser cache until browsing data is cleared.'
          : 'Offline and no cached assets found yet. Open once with internet to cache automatically.';
        return;
      }

      // Online: cache all libraries & compiled styles automatically in browser storage
      try {
        const fetchText = async (urls) => {
          for (const url of urls) {
            try {
              const r = await fetch(url, { mode: 'cors' });
              if (r.ok) return await r.text();
            } catch (e) {}
          }
          return null;
        };

        // Compile all Tailwind classes used in app so cached CSS covers every page
        let probe = null;
        try {
          const scriptText = Array.from(document.querySelectorAll('script')).map((s) => s.textContent || '').join(' ');
          const tokens = [...new Set((scriptText.match(/[a-z0-9:/_.-\[\]]+/gi) || []).filter((t) => t.length > 1 && t.length < 48 && /[-:]/.test(t)))];
          probe = document.createElement('div');
          probe.style.display = 'none';
          probe.className = tokens.join(' ');
          document.body.appendChild(probe);
          await new Promise((r) => setTimeout(r, 60));
        } catch (e) {}

        const tailwindCss = Array.from(document.head.querySelectorAll('style'))
          .map((st) => st.textContent || '')
          .join('\n');
        if (probe && probe.parentNode) probe.remove();

        const [katexCss, katexJs, katexAutoJs, markedJs, hljsCss, hljsJs] = await Promise.all([
          fetchText(['https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css', 'https://unpkg.com/katex@0.16.11/dist/katex.min.css']),
          fetchText(['https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js', 'https://unpkg.com/katex@0.16.11/dist/katex.min.js']),
          fetchText(['https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js', 'https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js']),
          fetchText(['https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js', 'https://unpkg.com/marked@12.0.2/marked.min.js']),
          fetchText(['https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css', 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css']),
          fetchText(['https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js', 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js'])
        ]);

        // Save into CacheStorage if available
        if ('caches' in window) {
          try {
            const cache = await caches.open(OFFLINE_CACHE_NAME);
            const urlsToCache = [
              location.href,
              'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css',
              'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js',
              'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js',
              'https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js',
              'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css',
              'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js'
            ];
            await Promise.all(urlsToCache.map((u) => cache.add(u).catch(() => {})));
          } catch (e) {}
        }

        // Also persist in localStorage as immediate fallback
        try {
          localStorage.setItem(OFFLINE_CACHE_KEY, JSON.stringify({
            cachedAt: Date.now(),
            tailwindCss,
            katexCss,
            katexJs,
            katexAutoJs,
            markedJs,
            hljsCss,
            hljsJs
          }));
        } catch (e) {}

        offlineCacheStatus = '✓ App & libraries cached in browser storage — works offline until browsing data is cleared.';
      } catch (e) {
        offlineCacheStatus = 'Cached locally in browser storage.';
      }
      const stEl = document.getElementById('about-offline-status-badge');
      if (stEl) stEl.textContent = offlineCacheStatus;
    }

                <button id="home-cta-exam" class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-indigo-500 hover:bg-indigo-400 text-white shadow-sm">
                  Launch Mock Test
                </button>
                <button id="home-cta-add" class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-white/10 hover:bg-white/20 border border-white/20 text-white">
                  + Add Question
                </button>
              </div>
            </div>
          </section>

          <!-- Live Stats Row -->
          <section class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs">
              <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Question Bank</div>
              <div class="text-2xl font-bold text-slate-900 mt-1">${totalQ}</div>
              <div class="text-xs text-slate-500 mt-0.5">Total MCQs stored</div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs">
              <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Coverage</div>
              <div class="text-2xl font-bold text-indigo-600 mt-1">${subjects.length} <span class="text-sm font-medium text-slate-500">/ ${topics.length}</span></div>
              <div class="text-xs text-slate-500 mt-0.5">Subjects / Topics</div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs">
              <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Mock Tests</div>
              <div class="text-2xl font-bold text-slate-900 mt-1">${totalExams}</div>
              <div class="text-xs text-slate-500 mt-0.5">Exams completed</div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs">
              <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Avg. Accuracy</div>
              <div class="text-2xl font-bold text-emerald-600 mt-1">${avgAcc}</div>
              <div class="text-xs text-slate-500 mt-0.5">Across conducted exams</div>
            </div>
          </section>

          <!-- Core Workspace Modules -->
          <section class="space-y-3">
            <h2 class="text-lg font-bold text-slate-900">Explore Modules</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <button data-home-go="bank" class="home-go-card text-left bg-white hover:border-indigo-400 rounded-2xl border border-slate-200 p-5 shadow-2xs hover:shadow-md transition-all group">
                <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-3 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                </div>
                <div class="font-bold text-slate-900">Question Bank</div>
                <p class="text-xs text-slate-500 mt-1 leading-relaxed">Organize by subject &amp; topic, bulk import JSON, and create AES-256 encrypted backups.</p>
              </button>

              <button data-home-go="practice" class="home-go-card text-left bg-white hover:border-emerald-400 rounded-2xl border border-slate-200 p-5 shadow-2xs hover:shadow-md transition-all group">
                <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-3 group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <div class="font-bold text-slate-900">Practice Mode</div>
                <p class="text-xs text-slate-500 mt-1 leading-relaxed">Drill topic-wise or build custom random sets with instant answer &amp; explanation reveal.</p>
              </button>

              <button data-home-go="exam" class="home-go-card text-left bg-white hover:border-purple-400 rounded-2xl border border-slate-200 p-5 shadow-2xs hover:shadow-md transition-all group">
                <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center mb-3 group-hover:bg-purple-600 group-hover:text-white transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <div class="font-bold text-slate-900">CBT Exam Mode</div>
                <p class="text-xs text-slate-500 mt-1 leading-relaxed">Standard online test pattern with countdown timer, palette, and negative marking.</p>
              </button>

              <button data-home-go="history" class="home-go-card text-left bg-white hover:border-amber-400 rounded-2xl border border-slate-200 p-5 shadow-2xs hover:shadow-md transition-all group">
                <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center mb-3 group-hover:bg-amber-600 group-hover:text-white transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                </div>
                <div class="font-bold text-slate-900">History &amp; Backups</div>
                <p class="text-xs text-slate-500 mt-1 leading-relaxed">Review past scores, inspect solutions, and backup/restore exam records separately.</p>
              </button>
            </div>
          </section>

          <!-- Subjects, Sources & Recent Exam Activity -->
          <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Subjects at a Glance -->
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-2xs space-y-4 flex flex-col">
              <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-2.5 min-w-0">
                  <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                  </div>
                  <h2 class="font-bold text-base text-slate-900 leading-none truncate">Subjects at a Glance</h2>
                </div>
                <button id="home-view-all-bank" class="text-xs font-semibold text-indigo-600 hover:underline inline-flex items-center gap-1 shrink-0">
                  <span>View All</span>
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
                </button>
              </div>
              ${subjects.length === 0 ? `
                <p class="text-sm text-slate-500">No subjects yet. Add your first question to get started.</p>
              ` : `
                <div class="flex flex-wrap gap-2.5">
                  ${subjects.map((s) => `
                    <button data-subj-jump="${escapeHtml(s)}" class="home-subj-chip px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 text-sm font-medium text-slate-800 flex items-center gap-2">
                      <span>${escapeHtml(s)}</span>
                      <span class="px-2 py-0.5 rounded-md bg-white border border-slate-200 text-xs font-bold text-indigo-600">${subjectCounts[s] || 0}</span>
                    </button>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- Exams & Sources at a Glance -->
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-2xs space-y-4 flex flex-col">
              <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-2.5 min-w-0">
                  <div class="w-8 h-8 rounded-lg bg-violet-50 text-violet-600 flex items-center justify-center shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" /></svg>
                  </div>
                  <h2 class="font-bold text-base text-slate-900 leading-none truncate">Exams &amp; Sources</h2>
                </div>
                <button id="home-view-all-sources" class="text-xs font-semibold text-indigo-600 hover:underline inline-flex items-center gap-1 shrink-0">
                  <span>View All</span>
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
                </button>
              </div>
              ${sources.length === 0 ? `
                <p class="text-sm text-slate-500">No questions yet. Add questions to see exam sources.</p>
              ` : `
                <div class="flex flex-wrap gap-2.5">
                  ${sources.map((s) => `
                    <button data-source-jump="${escapeHtml(s)}" class="home-source-chip px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50 hover:bg-violet-50 hover:border-violet-300 text-sm font-medium text-slate-800 flex items-center gap-2">
                      <span>${escapeHtml(s)}</span>
                      <span class="px-2 py-0.5 rounded-md bg-white border border-slate-200 text-xs font-bold text-violet-600">${sourceCounts[s] || 0}</span>
                    </button>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- Recent Mock Tests -->
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-2xs space-y-4 flex flex-col">
              <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-2.5 min-w-0">
                  <div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  </div>
                  <h2 class="font-bold text-base text-slate-900 leading-none truncate">Recent Mock Tests</h2>
                </div>
                <button id="home-view-all-hist" class="text-xs font-semibold text-indigo-600 hover:underline inline-flex items-center gap-1 shrink-0">
                  <span>Full History</span>
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
                </button>
              </div>
              ${recentExams.length === 0 ? `
                <div class="p-5 rounded-xl bg-slate-50 border border-dashed border-slate-200 text-center space-y-2">
                  <p class="text-sm text-slate-600">You haven't taken any mock tests yet.</p>
                  <button id="home-empty-exam-btn" class="px-4 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white hover:bg-indigo-700">Take Your First Exam</button>
                </div>
              ` : `
                <div class="divide-y divide-slate-100">
                  ${recentExams.map((h) => `
                    <div class="py-2.5 flex items-center justify-between gap-3">
                      <div class="min-w-0">
                        <div class="font-semibold text-sm text-slate-900 truncate">${escapeHtml(h.examName)}</div>
                        <div class="text-xs text-slate-400">${new Date(h.date).toLocaleDateString()} &bull; ${h.correctCount} Right / ${h.wrongCount} Wrong</div>
                      </div>
                      <div class="flex items-center gap-2.5 shrink-0">
                        <span class="font-bold text-sm text-indigo-600">${h.score}/${h.maxScore}</span>
                        <button data-home-rev="${escapeHtml(h.id)}" class="home-rev-btn px-2.5 py-1 rounded-lg text-xs font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100">Review</button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </section>
        </div>
      `;

      document.getElementById('home-cta-practice').addEventListener('click', () => navigateTo('practice'));
      document.getElementById('home-cta-exam').addEventListener('click', () => navigateTo('exam'));
      document.getElementById('home-cta-add').addEventListener('click', () => openQuestionEditorModal());
      document.getElementById('home-view-all-bank').addEventListener('click', () => {
        state.bankFilterSource = 'ALL';
        state.bankFilterSubject = 'ALL';
        state.bankFilterTopic = 'ALL';
        state.bankGroupBy = 'subject';
        navigateTo('bank');
      });
      document.getElementById('home-view-all-sources').addEventListener('click', () => {
        state.bankFilterSource = 'ALL';
        state.bankFilterSubject = 'ALL';
        state.bankFilterTopic = 'ALL';
        state.bankGroupBy = 'source';
        navigateTo('bank');
      });
      document.getElementById('home-view-all-hist').addEventListener('click', () => navigateTo('history'));
      document.getElementById('home-empty-exam-btn')?.addEventListener('click', () => navigateTo('exam'));

      main.querySelectorAll('.home-go-card').forEach((btn) => {
        btn.addEventListener('click', () => navigateTo(btn.dataset.homeGo));
      });
      main.querySelectorAll('.home-subj-chip').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.bankFilterSource = 'ALL';
          state.bankFilterSubject = btn.dataset.subjJump;
          state.bankFilterTopic = 'ALL';
          state.bankGroupBy = 'subject';
          navigateTo('bank');
        });
      });
      main.querySelectorAll('.home-source-chip').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.bankFilterSource = btn.dataset.sourceJump;
          state.bankFilterSubject = 'ALL';
          state.bankFilterTopic = 'ALL';
          state.bankGroupBy = 'source';
          navigateTo('bank');
        });
      });
      main.querySelectorAll('.home-rev-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.currentPage = 'history';
          state.historyReviewId = btn.dataset.homeRev;
          pushAppHistory('history');
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    // =========================================================================
    // NAVIGATION & APP RENDER LOOP
    // =========================================================================
    function renderApp(animate = false) {
      // Update nav active states (keep font-semibold consistent to prevent width shift)
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        const isActive = btn.dataset.nav === state.currentPage;
        btn.className = isActive
          ? 'nav-btn px-3.5 py-2 rounded-lg text-sm font-semibold bg-indigo-50 text-indigo-700 transition-colors'
          : 'nav-btn px-3.5 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors';
      });

      const main = document.getElementById('app-main');
      if (state.currentPage === 'home') renderHomePage(main);
      else if (state.currentPage === 'bank') renderQuestionBankPage(main);
      else if (state.currentPage === 'practice') renderPracticePage(main);
      else if (state.currentPage === 'exam') renderExamPage(main);
      else if (state.currentPage === 'history') renderHistoryPage(main);
      else if (state.currentPage === 'about') renderAboutPage(main);

      if (!animate) {
        main.querySelectorAll('.fade-in').forEach((el) => el.classList.remove('fade-in'));
      }
    }

    // Browser History & Back Key / Back Swipe Support
    function getHistorySnapshot(page = state.currentPage) {
      return {
        page,
        historyReviewId: state.historyReviewId,
        practiceActive: state.practice.active,
        examPhase: state.exam.phase === 'running' ? 'setup' : state.exam.phase
      };
    }

    function pushAppHistory(page = state.currentPage) {
      try {
        history.pushState(getHistorySnapshot(page), '', '#' + page);
      } catch (e) {
        // Ignore in restricted contexts
      }
    }

    function navigateTo(page) {
      if (state.currentPage === page && !state.historyReviewId && !state.practice.active) {
        return;
      }
      state.currentPage = page;
      state.historyReviewId = null;
      if (page !== 'practice') state.practice.active = false;
      pushAppHistory(page);
      renderApp(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('popstate', (e) => {
      // Close any open modal smoothly on back navigation
      const modalRoot = document.getElementById('modal-root');
      if (modalRoot && !modalRoot.classList.contains('hidden')) {
        closeModal();
      }
      const validPages = ['home', 'bank', 'practice', 'exam', 'history', 'about'];
      const hashPage = (location.hash || '').replace('#', '');
      const targetPage = (e.state && e.state.page) ? e.state.page : (validPages.includes(hashPage) ? hashPage : null);

      if (targetPage) {
        if (state.exam.phase === 'running' && targetPage !== 'exam') {
          clearExamTimer();
          state.exam.phase = 'setup';
        }
        state.currentPage = targetPage;
        state.historyReviewId = (e.state && e.state.historyReviewId) ? e.state.historyReviewId : null;
        state.practice.active = !!(e.state && e.state.practiceActive);
        if (e.state && e.state.examPhase && state.exam.phase !== 'running') {
          state.exam.phase = e.state.examPhase;
        }
        document.getElementById('mobile-nav').classList.add('hidden');
        renderApp(true);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    // Support desktop Backspace key (when not typing in a field) to navigate back
    window.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
      const isEditable = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable);
      if (isEditable) return;
      if (e.key === 'Backspace' && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        const modalRoot = document.getElementById('modal-root');
        if (modalRoot && !modalRoot.classList.contains('hidden')) {
          closeModal();
          return;
        }
        history.back();
      }
    });

    // Nav click listeners
    document.querySelectorAll('.nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (state.exam.phase === 'running' && btn.dataset.nav !== 'exam') {
          showToast('An exam is currently running. Submit or finish it before leaving.', 'warning');
          return;
        }
        document.getElementById('mobile-nav').classList.add('hidden');
        navigateTo(btn.dataset.nav);
      });
    });

    document.getElementById('brand-home-btn').addEventListener('click', () => {
      if (state.exam.phase === 'running') {
        showToast('An exam is currently running. Submit or finish it before leaving.', 'warning');
        return;
      }
      document.getElementById('mobile-nav').classList.add('hidden');
      navigateTo('home');
    });

    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
      document.getElementById('mobile-nav').classList.toggle('hidden');
    });

    // Initial render once DOM + deferred scripts are ready
    window.addEventListener('DOMContentLoaded', () => {
      try {
        history.replaceState(getHistorySnapshot('home'), '', '#home');
      } catch (e) {}
      renderApp();
    });
    window.addEventListener('load', () => {
      enhanceRenderedContent(document.getElementById('app-main'));
      initAutoOfflinePersistence();
    });
  </script>
</body>
</html>
