  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(circle at top right, #eef2ff 0%, #f8fafc 38%, #f1f5f9 100%);
      background-attachment: fixed;

      border-color: #6366f1 !important;
    }
    #cbt-timer {
      font-variant-numeric: tabular-nums;
    }
    /* Rich Text / Markdown / Math / Code styling */
    .rich-content p { margin-bottom: 0.5rem; line-height: 1.6; }
    .rich-content p:last-child { margin-bottom: 0; }
    .rich-content ul { list-style-type: disc; padding-left: 1.4rem; margin-bottom: 0.5rem; }
    .rich-content ol { list-style-type: decimal; padding-left: 1.4rem; margin-bottom: 0.5rem; }
    .rich-content blockquote {
      border-left: 3px solid #6366f1;
      padding-left: 0.75rem;
      color: #475569;
      margin: 0.5rem 0;
      font-style: italic;
    }
    .rich-content code:not(pre code) {
      background-color: #f1f5f9;
      color: #be185d;
      padding: 0.12rem 0.35rem;
      border-radius: 0.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875em;
    }
    .rich-content pre {
      margin: 0.65rem 0;
      border-radius: 0.5rem;
      overflow-x: auto;
      background: #0d1117;
      padding: 0.85rem 1rem;
    }
    .rich-content pre code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      background: transparent;
      padding: 0;
    }
    .rich-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.5rem 0;
      font-size: 0.9rem;
    }
    .rich-content th, .rich-content td {
      border: 1px solid #cbd5e1;
      padding: 0.4rem 0.6rem;
      text-align: left;
    }
    .rich-content th { background-color: #f1f5f9; font-weight: 600; }
    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.25rem 0;
      margin: 0.5rem 0;
    }
    /* Clean, subtle view transitions */
    html {
      scroll-behavior: smooth;
    }
    button, a, select, input, textarea {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .fade-in {
      animation: fadeIn 0.22s ease-out;
    }
    @keyframes fadeIn {

      to { opacity: 1; }
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

    function safeLoad(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSave(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        showToast('Storage quota warning: unable to persist to browser storage.', 'error');
      }

      currentPage: 'home', // 'home' | 'bank' | 'practice' | 'exam' | 'history' | 'about'

    // =========================================================================
    // UTILITIES: RICH TEXT + MATH + CODE RENDERING
    // =========================================================================
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderRichText(raw) {
      if (!raw) return '';
      let text = String(raw);

      // Protect fenced code blocks & inline code first
      const codeBlocks = [];
      text = text.replace(/```([\w+-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push({ type: 'block', lang: lang || 'plaintext', code });
        return `@@CODEBLOCK_${idx}@@`;
      });

      const inlineCodes = [];
      text = text.replace(/`([^`\n]+)`/g, (_, code) => {
        const idx = inlineCodes.length;
        inlineCodes.push(code);
        return `@@INLINECODE_${idx}@@`;
      });

      // Protect display & inline LaTeX math
      const mathTokens = [];
      text = text.replace(/\$\$([\s\S]+?)\$\$/g, (m) => {
        const idx = mathTokens.length;
        mathTokens.push(m);
        return `@@MATH_${idx}@@`;
      });
      text = text.replace(/\\\[([\s\S]+?)\\\]/g, (m) => {
        const idx = mathTokens.length;
        mathTokens.push(m);
        return `@@MATH_${idx}@@`;
      });
      text = text.replace(/\\\(([\s\S]+?)\\\)/g, (m) => {
        const idx = mathTokens.length;
        mathTokens.push(m);
        return `@@MATH_${idx}@@`;
      });
      text = text.replace(/\$([^\n$]+?)\$/g, (m) => {
        const idx = mathTokens.length;
        mathTokens.push(m);
        return `@@MATH_${idx}@@`;
      });

      // Parse Markdown
      let html = '';
      if (window.marked) {
        html = window.marked.parse(text, { breaks: true, gfm: true });
      } else {
        html = escapeHtml(text).replace(/\n/g, '<br>');
      }

      // Basic XSS sanitization (strip script/iframe/on* attributes)
      html = html.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, '')
                 .replace(/<iframe[\s\S]*?>[\s\S]*?<\/iframe>/gi, '')
                 .replace(/\son\w+\s*=\s*(['"]).*?\1/gi, '');

      // Restore math tokens (escaped safely for HTML text node so KaTeX auto-render parses them)
      html = html.replace(/@@MATH_(\d+)@@/g, (_, i) => escapeHtml(mathTokens[Number(i)]));

      // Restore inline code
      html = html.replace(/@@INLINECODE_(\d+)@@/g, (_, i) => `<code>${escapeHtml(inlineCodes[Number(i)])}</code>`);

      // Restore code blocks
      html = html.replace(/@@CODEBLOCK_(\d+)@@/g, (_, i) => {
        const blk = codeBlocks[Number(i)];
        return `<pre><code class="language-${escapeHtml(blk.lang)}">${escapeHtml(blk.code)}</code></pre>`;
      });

      return `<div class="rich-content">${html}</div>`;
    }

    function enhanceRenderedContent(rootEl) {
      if (!rootEl) return;
      // Highlight.js
      if (window.hljs) {
        rootEl.querySelectorAll('pre code').forEach((block) => {
          if (!block.dataset.highlighted) {
            window.hljs.highlightElement(block);
            block.dataset.highlighted = 'yes';
          }
        });
      }
      // KaTeX auto-render
      if (window.renderMathInElement) {
        try {
          window.renderMathInElement(rootEl, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false },
              { left: '\\[', right: '\\]', display: true }
            ],
            throwOnError: false
          });
        } catch (e) {
          // ignore partial math parse errors during live preview
        }
      }
    }

    // =========================================================================
    // TOAST & MODAL HELPERS (NO alert/confirm/prompt)
    // =========================================================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        info: 'bg-slate-900 text-white',
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-600 text-white'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center justify-between gap-3 fade-in ${colors[type] || colors.info}`;
      el.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';

    // =========================================================================
    // ENCRYPTED BACKUP & RESTORE (WEB CRYPTO AES-GCM + PBKDF2)
    // =========================================================================
    function bufToBase64(buf) {
      const bytes = new Uint8Array(buf);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function base64ToBuf(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }

    async function deriveAesKey(password, saltBytes, iterations = 100000) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        enc.encode(password),
        'PBKDF2',
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: saltBytes,
          iterations,
          hash: 'SHA-256'
        },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encryptPayload(dataObj, password, backupType) {
      if (!window.crypto || !window.crypto.subtle) {
        throw new Error('Web Crypto API is unavailable in this browser context.');
      }
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveAesKey(password, salt, 100000);
      const enc = new TextEncoder();
      const plaintext = enc.encode(JSON.stringify(dataObj));
      const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plaintext);
      return {
        format: 'examvault-encrypted-v1',
        type: backupType, // 'questions' | 'exams'
        alg: 'AES-256-GCM',
        kdf: 'PBKDF2-SHA256',
        iterations: 100000,
        salt: bufToBase64(salt),
        iv: bufToBase64(iv),
        ciphertext: bufToBase64(ciphertext),
        createdAt: new Date().toISOString()
      };
    }

    async function decryptPayload(envelope, password, expectedType) {
      if (!window.crypto || !window.crypto.subtle) {
        throw new Error('Web Crypto API is unavailable in this browser context.');
      }
      if (!envelope || envelope.format !== 'examvault-encrypted-v1') {
        throw new Error('Invalid backup file format.');
      }
      if (envelope.type !== expectedType) {
        throw new Error(`This backup is for "${envelope.type}", not "${expectedType}".`);
      }
      const salt = new Uint8Array(base64ToBuf(envelope.salt));
      const iv = new Uint8Array(base64ToBuf(envelope.iv));
      const ciphertext = base64ToBuf(envelope.ciphertext);
      const key = await deriveAesKey(password, salt, envelope.iterations || 100000);
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
      const dec = new TextDecoder();
      return JSON.parse(dec.decode(plainBuf));
    }

    function downloadJsonFile(obj, filename) {
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

        try {
          const payload = isQuestions ? state.questions : state.examHistory;
          const envelope = await encryptPayload(payload, p1, backupType);
          const dateStr = new Date().toISOString().slice(0, 10);

      document.getElementById('rst-submit').addEventListener('click', async () => {
        const fileInput = document.getElementById('rst-file');
        const pass = document.getElementById('rst-pass').value;
        const mode = document.querySelector('input[name="rst-mode"]:checked').value;
        const errEl = document.getElementById('rst-err');

        if (!fileInput.files || !fileInput.files[0]) {
          errEl.textContent = 'Please select an encrypted backup file.';
          errEl.classList.remove('hidden');
          return;
        }
        if (!pass) {
          errEl.textContent = 'Please enter the decryption password.';
          errEl.classList.remove('hidden');
          return;
        }

        try {
          const text = await fileInput.files[0].text();
          const envelope = JSON.parse(text);
          const restored = await decryptPayload(envelope, pass, backupType);
          if (!Array.isArray(restored)) throw new Error('Corrupted backup payload.');

          if (isQuestions) {
            if (mode === 'replace') {
              state.questions = restored;
              state.selectedQuestionIds.clear();
            } else {
              const existingIds = new Set(state.questions.map((q) => q.id));
              let added = 0;
              restored.forEach((q) => {
                if (!existingIds.has(q.id)) {
                  state.questions.push(q);
                  added++;
                }
              });
              showToast(`Restored ${added} new question(s) (merged).`, 'success');
              safeSave(STORAGE_KEYS.QUESTIONS, state.questions);
              closeModal();
              renderApp();
              return;
            }
            safeSave(STORAGE_KEYS.QUESTIONS, state.questions);
            showToast(`Restored ${restored.length} question(s).`, 'success');
          } else {
            if (mode === 'replace') {
              state.examHistory = restored;
            } else {
              const existingIds = new Set(state.examHistory.map((h) => h.id));
              let added = 0;
              restored.forEach((h) => {
                if (!existingIds.has(h.id)) {
                  state.examHistory.push(h);
                  added++;
                }
              });
              state.examHistory.sort((a, b) => b.date - a.date);
              safeSave(STORAGE_KEYS.HISTORY, state.examHistory);
              closeModal();
              showToast(`Restored ${added} new exam record(s) (merged).`, 'success');
              renderApp();
              return;
            }
            state.examHistory.sort((a, b) => b.date - a.date);
            safeSave(STORAGE_KEYS.HISTORY, state.examHistory);
            showToast(`Restored ${restored.length} exam record(s).`, 'success');
          }
          closeModal();
          renderApp();
        } catch (err) {
          errEl.textContent = err.message && err.message.includes('not ')
            ? err.message
            : 'Decryption failed. Check your password or backup file.';
          errEl.classList.remove('hidden');
        }
      });
    }

    // =========================================================================
    // QUESTION HELPERS
    // =========================================================================
    function getUniqueSubjects(questions = state.questions) {
      return [...new Set(questions.map((q) => q.subject.trim()).filter(Boolean))].sort();
    }

    function getUniqueTopics(subject = 'ALL', questions = state.questions) {
      const filtered = subject === 'ALL'
        ? questions
        : questions.filter((q) => q.subject === subject);
      return [...new Set(filtered.map((q) => q.topic.trim()).filter(Boolean))].sort();
    }

    function parseSourceList(raw) {
      if (Array.isArray(raw)) {
        return [...new Set(raw.map((s) => String(s).trim()).filter((s) => s && s.toLowerCase() !== 'uncategorized'))];
      }
      if (typeof raw === 'string') {
        return [...new Set(raw.split(/[,;]+/).map((s) => s.trim()).filter((s) => s && s.toLowerCase() !== 'uncategorized'))];
      }
      return [];
    }

    function getQuestionSources(q) {
      if (!q) return ['Uncategorized'];
      const list = parseSourceList(q.examSources && q.examSources.length ? q.examSources : q.examSource);
      return list.length > 0 ? list : ['Uncategorized'];
    }

    function getQuestionSource(q) {
      return getQuestionSources(q).join(', ');
    }

    function getUniqueSources(questions = state.questions) {
      const set = new Set();
      questions.forEach((q) => {
        getQuestionSources(q).forEach((s) => set.add(s));
      });
      const list = [...set].filter((s) => s !== 'Uncategorized').sort();
      if (set.has('Uncategorized')) list.push('Uncategorized');
      return list;
    }

    function getFilteredBankQuestions() {
      const search = state.bankSearch.trim().toLowerCase();
      return state.questions.filter((q) => {
        const qSources = getQuestionSources(q);
        if (state.bankFilterSource !== 'ALL' && !qSources.includes(state.bankFilterSource)) return false;
        if (state.bankFilterSubject !== 'ALL' && q.subject !== state.bankFilterSubject) return false;
        if (state.bankFilterTopic !== 'ALL' && q.topic !== state.bankFilterTopic) return false;
        if (search) {
          const hay = `${qSources.join(' ')} ${q.subject} ${q.topic} ${q.questionText} ${q.options.join(' ')} ${q.explanation || ''}`.toLowerCase();
          if (!hay.includes(search)) return false;
        }
        return true;
      });
    }

    function optionLetter(idx) {
      return ['A', 'B', 'C', 'D', 'E'][idx] || String(idx + 1);
    }

        btn.addEventListener('click', () => {
          const target = document.getElementById(activeTextareaId) || qInput;
          const fmt = btn.dataset.fmt;
          const start = target.selectionStart;
          const end = target.selectionEnd;
          const selected = target.value.slice(start, end) || 'text';
          let insert = selected;
          if (fmt === 'bold') insert = `**${selected}**`;
          else if (fmt === 'italic') insert = `*${selected}*`;
          else if (fmt === 'code') insert = `\`${selected}\``;
          else if (fmt === 'codeblock') insert = `\n\`\`\`python\n${selected === 'text' ? 'print("Hello")' : selected}\n\`\`\`\n`;
          else if (fmt === 'math') insert = `$${selected === 'text' ? 'x^2 + y^2 = r^2' : selected}$`;
          else if (fmt === 'mathblock') insert = `\n$$\n${selected === 'text' ? '\\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}' : selected}\n$$\n`;
          else if (fmt === 'list') insert = `\n- Item 1\n- Item 2\n`;

          target.setRangeText(insert, start, end, 'end');
          target.focus();
          if (target.id === 'qe-question') updatePreview();

              <span class="w-8 h-9 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 ${currentCorrect === idx ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700'}">${optionLetter(idx)}</span>
            </label>
            <input type="text" data-opt-idx="${idx}" value="${escapeHtml(val)}" placeholder="Option ${optionLetter(idx)} ${idx < 2 ? '(Compulsory)' : '(Optional)'}" class="qe-opt-input flex-1 min-w-0 h-9 px-3 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-indigo-500 outline-none" />
            ${idx >= 2 ? `<button type="button" data-remove-opt="${idx}" class="w-9 h-9 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 flex items-center justify-center shrink-0" title="Remove option"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>` : '<div class="w-9 h-9 shrink-0"></div>'}
          </div>
        `).join('');

        optListEl.querySelectorAll('input[name="qe-correct"]').forEach((r) => {
          r.addEventListener('change', (e) => {
            currentCorrect = Number(e.target.value);
            renderOptionInputs();
          });
        });

        optListEl.querySelectorAll('.qe-opt-input').forEach((inp) => {
          inp.addEventListener('input', (e) => {
            currentOptions[Number(e.target.dataset.optIdx)] = e.target.value;
          });
          inp.addEventListener('focus', () => {
            // allow formatting toolbar to target options too
            activeTextareaId = '';
          });
        });

        optListEl.querySelectorAll('[data-remove-opt]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const rIdx = Number(btn.dataset.removeOpt);
            currentOptions.splice(rIdx, 1);
            if (currentCorrect === rIdx) currentCorrect = 0;
            else if (currentCorrect > rIdx) currentCorrect--;
            renderOptionInputs();
          });
        });
      }

      addOptBtn.addEventListener('click', () => {
        if (currentOptions.length < 5) {
          currentOptions.push('');
          renderOptionInputs();
        }
      });

      renderOptionInputs();

      document.getElementById('qe-close').addEventListener('click', closeModal);
      document.getElementById('qe-cancel').addEventListener('click', closeModal);
      document.getElementById('qe-save').addEventListener('click', () => {
        const subject = document.getElementById('qe-subject').value.trim();
        const topic = document.getElementById('qe-topic').value.trim();
        const examSources = parseSourceList(document.getElementById('qe-source').value);
        const examSource = examSources.join(', ');
        const questionText = qInput.value.trim();
        const explanation = expInput.value.trim();
        const errEl = document.getElementById('qe-error');

        const cleanedOptions = currentOptions.map((o) => o.trim());
        if (!subject || !topic || !questionText) {
          errEl.textContent = 'Subject, Topic, and Question Text are required.';
          errEl.classList.remove('hidden');
          return;
        }
        if (!cleanedOptions[0] || !cleanedOptions[1]) {
          errEl.textContent = 'Options A and B are compulsory and cannot be empty.';
          errEl.classList.remove('hidden');
          return;
        }
        // Filter out trailing/empty optional options while remapping correctIndex
        const finalOptions = [];
        let mappedCorrect = 0;
        cleanedOptions.forEach((opt, i) => {
          if (opt) {
            if (i === currentCorrect) mappedCorrect = finalOptions.length;
            finalOptions.push(opt);
          }
        });
        if (finalOptions.length < 2) {
          errEl.textContent = 'At least 2 non-empty options are required.';
          errEl.classList.remove('hidden');
          return;
        }
        if (!cleanedOptions[currentCorrect]) {
          errEl.textContent = 'The selected right answer cannot be an empty option.';
          errEl.classList.remove('hidden');
          return;
        }

        const now = Date.now();
        if (existing) {
          existing.subject = subject;
          existing.topic = topic;
          existing.examSources = examSources;
          existing.examSource = examSource;
          existing.questionText = questionText;
          existing.imageData = currentImageData;
          existing.options = finalOptions;
          existing.correctIndex = mappedCorrect;
          existing.explanation = explanation;
          existing.updatedAt = now;
          showToast('Question updated.', 'success');
        } else {
          state.questions.unshift({
            id: 'q_' + now + '_' + Math.random().toString(36).slice(2, 7),
            subject,
            topic,
            examSources,
            examSource,
            questionText,
            imageData: currentImageData,
            options: finalOptions,
            correctIndex: mappedCorrect,
            explanation,
            createdAt: now,
            updatedAt: now
          });
          showToast('Question added to bank!', 'success');
        }
        safeSave(STORAGE_KEYS.QUESTIONS, state.questions);
        closeModal();
        renderApp();
      });
    }

    function downloadCsvFile(csvText, filename) {
      const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function parseCsvRows(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') {
            field += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            field += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(field);
            field = '';
          } else if (ch === '\r' && next === '\n') {
            row.push(field);
            rows.push(row);
            row = [];
            field = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            row.push(field);
            rows.push(row);
            row = [];
            field = '';
          } else {
            field += ch;
          }
        }
      }
      if (field.length > 0 || row.length > 0) {
        row.push(field);
        rows.push(row);
      }
      return rows.filter((r) => r.some((cell) => cell.trim() !== ''));
    }

    function parseBulkCsv(rawCsv, defaultSubject, defaultTopic, defaultSource = '') {
      const rows = parseCsvRows(rawCsv.trim());
      if (rows.length < 2) {
        throw new Error('CSV must include a header row and at least one question row.');
      }
      const headers = rows[0].map((h) => h.trim().toLowerCase().replace(/[\s_]+/g, ''));
      const col = (names) => {
        for (const n of names) {
          const i = headers.indexOf(n);
          if (i !== -1) return i;
        }
        return -1;
      };

      const iSubj = col(['subject']);
      const iTop = col(['topic']);
      const iSrc = col(['examsource', 'source', 'exam', 'examname']);
      const iQ = col(['question', 'questiontext']);
      const iA = col(['optiona', 'a']);
      const iB = col(['optionb', 'b']);
      const iC = col(['optionc', 'c']);
      const iD = col(['optiond', 'd']);
      const iE = col(['optione', 'e']);
      const iAns = col(['answer', 'rightanswer', 'correct', 'correctanswer']);
      const iExp = col(['explanation', 'exp']);

      if (iQ === -1 || iA === -1 || iB === -1 || iAns === -1) {
        throw new Error('CSV header must include: question, optionA, optionB, and answer (plus optional subject, topic, optionC, optionD, optionE, explanation).');
      }

      const now = Date.now();
      const imported = [];

      for (let r = 1; r < rows.length; r++) {
        const cells = rows[r];
        const get = (idx) => (idx !== -1 && cells[idx] !== undefined ? cells[idx].trim() : '');

        const subject = get(iSubj) || defaultSubject.trim();
        const topic = get(iTop) || defaultTopic.trim();
        const examSources = parseSourceList(get(iSrc) || defaultSource);
        const examSource = examSources.join(', ');
        const questionText = get(iQ);
        const rawOpts = [get(iA), get(iB), get(iC), get(iD), get(iE)];
        const ansRaw = get(iAns).toUpperCase();
        const explanation = get(iExp);

        if (!subject || !topic) {
          throw new Error(`Row ${r + 1}: Subject and Topic are required (fill the CSV columns or set Default Subject/Topic above).`);
        }
        if (!questionText) {
          throw new Error(`Row ${r + 1}: Question text is empty.`);
        }
        if (!rawOpts[0] || !rawOpts[1]) {
          throw new Error(`Row ${r + 1}: optionA and optionB are compulsory.`);
        }

        const options = [];
        const letterMap = ['A', 'B', 'C', 'D', 'E'];
        let ansLetter = ansRaw;
        if (/^[1-5]$/.test(ansRaw)) ansLetter = letterMap[Number(ansRaw) - 1];

        let targetOrigIdx = letterMap.indexOf(ansLetter);
        if (targetOrigIdx === -1) {
          throw new Error(`Row ${r + 1}: Invalid answer "${ansRaw}". Use A, B, C, D, or E.`);
        }

        let mappedCorrect = -1;
        rawOpts.forEach((optVal, oIdx) => {
          if (optVal) {
            if (oIdx === targetOrigIdx) mappedCorrect = options.length;
            options.push(optVal);
          }
        });

        if (options.length < 2) {
          throw new Error(`Row ${r + 1}: At least 2 options are required.`);
        }
        if (mappedCorrect === -1) {
          throw new Error(`Row ${r + 1}: Answer "${ansRaw}" points to an empty option.`);
        }

        imported.push({
          id: 'q_' + now + '_' + r + '_' + Math.random().toString(36).slice(2, 6),
          subject,
          topic,
          examSources,
          examSource,
          questionText,
          imageData: null,
          options,
          correctIndex: mappedCorrect,
          explanation,
          createdAt: now,
          updatedAt: now
        });
      }
      return imported;
    }

              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Or Paste JSON Array Here</label>
                <textarea id="bi-textarea" rows="6" placeholder='[{"subject":"Math","topic":"Algebra","questionText":"2+2=?","options":["3","4"],"correctIndex":1}]' class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-mono focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
              </div>
            </div>
          </div>

          <p id="bi-err" class="text-xs text-rose-600 font-medium hidden"></p>
        </div>

        <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-2.5">
          <button id="bi-cancel" class="px-4 py-2 rounded-lg text-sm font-medium border border-slate-300 text-slate-700 hover:bg-white">Cancel</button>
          <button id="bi-import" class="px-5 py-2 rounded-lg text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">Validate &amp; Import</button>
        </div>
      `, 'max-w-3xl');

      const tabSimple = document.getElementById('bi-tab-simple');
      const tabJson = document.getElementById('bi-tab-json');
      const panelSimple = document.getElementById('bi-panel-simple');
      const panelJson = document.getElementById('bi-panel-json');
      const errEl = document.getElementById('bi-err');

      function switchTab(tab) {
        activeTab = tab;
        errEl.classList.add('hidden');
        if (tab === 'simple') {
          tabSimple.className = 'px-4 py-2 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-700';
          tabJson.className = 'px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800';
          panelSimple.classList.remove('hidden');
          panelJson.classList.add('hidden');
        } else {
          tabJson.className = 'px-4 py-2 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-700';
          tabSimple.className = 'px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800';
          panelJson.classList.remove('hidden');
          panelSimple.classList.add('hidden');
        }
      }

      tabSimple.addEventListener('click', () => switchTab('simple'));
      tabJson.addEventListener('click', () => switchTab('json'));

      const simpleTextarea = document.getElementById('bi-simple-textarea');
      const simpleStatus = document.getElementById('bi-simple-status');
      const defSubjEl = document.getElementById('bi-def-subj');
      const defTopEl = document.getElementById('bi-def-top');
      const defSourceEl = document.getElementById('bi-def-source');

      function updateSimplePreview() {
        const val = simpleTextarea.value.trim();
        if (!val) {
          simpleStatus.textContent = 'Ready to parse CSV.';
          simpleStatus.className = 'text-xs text-slate-500';
          return;
        }
        try {
          const parsed = parseBulkCsv(val, defSubjEl.value, defTopEl.value, defSourceEl.value);
          simpleStatus.textContent = `✓ Detected ${parsed.length} valid question(s) ready to import.`;
          simpleStatus.className = 'text-xs font-semibold text-emerald-700';
        } catch (e) {
          simpleStatus.textContent = e.message;
          simpleStatus.className = 'text-xs text-amber-700';
        }
      }

      simpleTextarea.addEventListener('input', updateSimplePreview);
      defSubjEl.addEventListener('input', updateSimplePreview);
      defTopEl.addEventListener('input', updateSimplePreview);
      defSourceEl.addEventListener('input', updateSimplePreview);

      document.getElementById('bi-load-simple-sample').addEventListener('click', () => {
        simpleTextarea.value = sampleCsvText;
        updateSimplePreview();
      });
      document.getElementById('bi-download-csv-sample').addEventListener('click', () => {
        downloadCsvFile(sampleCsvText, 'examvault-sample-import.csv');
      });

      document.getElementById('bi-simple-file').addEventListener('change', async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        simpleTextarea.value = await f.text();
        updateSimplePreview();
      });

      document.getElementById('bi-close').addEventListener('click', closeModal);
      document.getElementById('bi-cancel').addEventListener('click', closeModal);
      document.getElementById('bi-download-sample').addEventListener('click', () => {
        downloadJsonFile(sampleJson, 'examvault-sample-import.json');
      });
      document.getElementById('bi-file').addEventListener('change', async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        document.getElementById('bi-textarea').value = await f.text();
      });

      document.getElementById('bi-import').addEventListener('click', () => {
        errEl.classList.add('hidden');
        if (activeTab === 'simple') {
          const raw = simpleTextarea.value.trim();
          if (!raw) {
            errEl.textContent = 'Please paste CSV content or upload a .csv file.';
            errEl.classList.remove('hidden');
            return;
          }
          try {
            const imported = parseBulkCsv(raw, defSubjEl.value, defTopEl.value, defSourceEl.value);
            state.questions = [...imported, ...state.questions];
            safeSave(STORAGE_KEYS.QUESTIONS, state.questions);
            closeModal();
            showToast(`Successfully imported ${imported.length} question(s)!`, 'success');
            renderApp();
          } catch (err) {
            errEl.textContent = err.message || 'Could not parse text format.';
            errEl.classList.remove('hidden');
          }
          return;
        }

        // JSON Mode (Existing)
        const raw = document.getElementById('bi-textarea').value.trim();
        if (!raw) {
          errEl.textContent = 'Please upload a JSON file or paste JSON content.';
          errEl.classList.remove('hidden');
          return;
        }
        try {
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed) || parsed.length === 0) {
            throw new Error('JSON must be a non-empty array of question objects.');
          }
          const now = Date.now();
          const imported = [];
          parsed.forEach((item, idx) => {
            if (!item.subject || !item.topic || !item.questionText) {
              throw new Error(`Item #${idx + 1}: Missing subject, topic, or questionText.`);
            }
            if (!Array.isArray(item.options) || item.options.length < 2 || item.options.length > 5) {
              throw new Error(`Item #${idx + 1}: "options" must be an array of 2 to 5 strings.`);
            }
            const cIdx = Number(item.correctIndex);
            if (Number.isNaN(cIdx) || cIdx < 0 || cIdx >= item.options.length) {
              throw new Error(`Item #${idx + 1}: Invalid "correctIndex" (must be 0 to ${item.options.length - 1}).`);
            }
            imported.push({
              id: 'q_' + now + '_' + idx + '_' + Math.random().toString(36).slice(2, 6),
              subject: String(item.subject).trim(),
              topic: String(item.topic).trim(),
              examSources: parseSourceList(item.examSources || item.examSource || item.source || item.exam),
              examSource: parseSourceList(item.examSources || item.examSource || item.source || item.exam).join(', '),
              questionText: String(item.questionText).trim(),
              imageData: item.imageData || null,
              options: item.options.map((o) => String(o).trim()),
              correctIndex: cIdx,
              explanation: item.explanation ? String(item.explanation).trim() : '',
              createdAt: now,
              updatedAt: now
            });
          });
          state.questions = [...imported, ...state.questions];
          safeSave(STORAGE_KEYS.QUESTIONS, state.questions);
          closeModal();
          showToast(`Successfully imported ${imported.length} question(s)!`, 'success');
          renderApp();
        } catch (err) {
          errEl.textContent = err.message || 'Invalid JSON format.';
          errEl.classList.remove('hidden');
        }
      });
    }

    // =========================================================================
    // PAGE 1: QUESTION BANK
    // =========================================================================
    function renderQuestionBankPage(main) {
      const sources = getUniqueSources();
      const subjects = getUniqueSubjects();
      const topics = getUniqueTopics(state.bankFilterSubject);
      const filtered = getFilteredBankQuestions();
      const selectedCount = state.selectedQuestionIds.size;

      // Group filtered questions either by Exam/Source -> Subject/Topic or Subject -> Topic
      const grouped = {};
      if (state.bankGroupBy === 'source') {
        filtered.forEach((q) => {
          const subTopic = `${q.subject} • ${q.topic}`;
          getQuestionSources(q).forEach((srcName) => {
            if (!grouped[srcName]) grouped[srcName] = {};
            if (!grouped[srcName][subTopic]) grouped[srcName][subTopic] = [];
            grouped[srcName][subTopic].push(q);
          });
        });
      } else {
        filtered.forEach((q) => {
          if (!grouped[q.subject]) grouped[q.subject] = {};
          if (!grouped[q.subject][q.topic]) grouped[q.subject][q.topic] = [];
          grouped[q.subject][q.topic].push(q);
        });
      }
      const primaryKeys = Object.keys(grouped).sort((a, b) => {
        if (a === 'Uncategorized') return 1;
        if (b === 'Uncategorized') return -1;
        return a.localeCompare(b);
      });

      main.innerHTML = `
        <div class="space-y-6 fade-in">
          <!-- Header & Primary Actions -->
          <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <div>

              <p class="text-sm text-slate-500 mt-0.5">${state.questions.length} total questions across ${subjects.length} subject(s)</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button id="qb-add-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-xs inline-flex items-center gap-1.5">
                <span>+</span> Add Question
              </button>
              <button id="qb-bulk-import-btn" class="px-3.5 py-2 rounded-xl text-sm font-medium bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">
                Bulk Import &amp; Guide
              </button>
              <button id="qb-backup-btn" class="px-3.5 py-2 rounded-xl text-sm font-medium bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">
                Encrypted Backup
              </button>
              <button id="qb-restore-btn" class="px-3.5 py-2 rounded-xl text-sm font-medium bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">
                Restore
              </button>
            </div>
          </div>

          <!-- Filter & Bulk Action Toolbar -->
          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
              <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1">Exam / Source</label>
                <select id="qb-filter-source" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                  <option value="ALL">All Sources</option>
                  ${sources.map((s) => `<option value="${escapeHtml(s)}" ${state.bankFilterSource === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1">Subject</label>
                <select id="qb-filter-subject" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                  <option value="ALL">All Subjects</option>
                  ${subjects.map((s) => `<option value="${escapeHtml(s)}" ${state.bankFilterSubject === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1">Topic</label>
                <select id="qb-filter-topic" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                  <option value="ALL">All Topics</option>
                  ${topics.map((t) => `<option value="${escapeHtml(t)}" ${state.bankFilterTopic === t ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1">Group By</label>
                <select id="qb-group-by" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                  <option value="source" ${state.bankGroupBy === 'source' ? 'selected' : ''}>Exam / Source</option>
                  <option value="subject" ${state.bankGroupBy === 'subject' ? 'selected' : ''}>Subject &amp; Topic</option>
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1">Search</label>
                <input id="qb-search" type="text" value="${escapeHtml(state.bankSearch)}" placeholder="Keyword, source, formula..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>
            </div>

            <div class="pt-2 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <label class="inline-flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                  <input id="qb-select-all" type="checkbox" ${filtered.length > 0 && filtered.every((q) => state.selectedQuestionIds.has(q.id)) ? 'checked' : ''} class="w-4 h-4 rounded text-indigo-600" />
                  <span>Select all shown (${filtered.length})</span>
                </label>
                ${selectedCount > 0 ? `
                  <button id="qb-bulk-delete-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white">
                    Bulk Delete (${selectedCount})
                  </button>
                ` : ''}
              </div>
              <div class="flex items-center gap-2 flex-wrap">
                ${filtered.length > 0 ? `
                  <button id="qb-expand-all" class="px-2.5 py-1 rounded-lg text-xs font-medium border border-slate-200 text-slate-600 hover:bg-slate-50">Expand All</button>
                  <button id="qb-collapse-all" class="px-2.5 py-1 rounded-lg text-xs font-medium border border-slate-200 text-slate-600 hover:bg-slate-50">Wrap All</button>
                ` : ''}
                <span class="text-xs text-slate-500">Showing ${filtered.length} of ${state.questions.length} questions</span>
              </div>
            </div>
          </div>

          <!-- Questions List (Wrapped by Subject -> Topic) -->
          ${filtered.length === 0 ? `
            <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-12 text-center">
              <p class="text-slate-600 font-medium">No questions match your current filters.</p>
              <button id="qb-empty-add" class="mt-3 px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700">+ Add Your First Question</button>
            </div>
          ` : primaryKeys.map((subj) => {
            const isSubjCollapsed = state.collapsedSubjects.has(subj);
            const topicKeys = Object.keys(grouped[subj]).sort();
            const subjTotal = topicKeys.reduce((acc, t) => acc + grouped[subj][t].length, 0);
            return `
            <section class="space-y-3 pt-2">
              <button type="button" data-toggle-subj="${escapeHtml(subj)}" class="qb-toggle-subj w-full flex items-center justify-between gap-3 text-left pb-2 border-b border-slate-200">

                  <svg class="w-4 h-4 text-slate-500 shrink-0 transition-transform duration-200 ${isSubjCollapsed ? '-rotate-90' : 'rotate-0'}" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                  </svg>
                  <span class="text-base font-bold text-slate-900 leading-relaxed py-1 break-words">${escapeHtml(subj)}</span>
                </div>
                <span class="px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 text-xs font-semibold shrink-0">${topicKeys.length} ${state.bankGroupBy === 'source' ? 'group(s)' : 'topic(s)'} &bull; ${subjTotal} Q</span>
              </button>
              ${isSubjCollapsed ? '' : `
                <div class="space-y-3 pt-1 fade-in">
                  ${topicKeys.map((top) => {
                    const topicKey = subj + '::' + top;
                    const isTopCollapsed = !state.expandedTopics.has(topicKey);
                    return `
                    <div class="space-y-3 pl-2 sm:pl-4">
                      <button type="button" data-toggle-topic="${escapeHtml(topicKey)}" class="qb-toggle-topic w-full flex items-center justify-between gap-3 text-left">
                        <div class="flex items-center gap-2.5 min-w-0">
                          <svg class="w-4 h-4 text-slate-400 shrink-0 transition-transform duration-200 ${isTopCollapsed ? '-rotate-90' : 'rotate-0'}" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                          </svg>
                          <span class="text-sm font-bold text-slate-800 leading-relaxed py-1 break-words">${escapeHtml(top)}</span>
                        </div>
                        <span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs font-semibold shrink-0">${grouped[subj][top].length} Q</span>
                      </button>
                      ${isTopCollapsed ? '' : `
                        <div class="grid grid-cols-1 gap-3.5 fade-in">
                          ${grouped[subj][top].map((q) => renderQuestionCard(q)).join('')}

                    </div>

                </div>

          `;
          }).join('')}
        </div>
      `;

      // Bind listeners
      document.getElementById('qb-add-btn').addEventListener('click', () => openQuestionEditorModal());
      document.getElementById('qb-empty-add')?.addEventListener('click', () => openQuestionEditorModal());
      document.getElementById('qb-bulk-import-btn').addEventListener('click', openBulkImportModal);
      document.getElementById('qb-backup-btn').addEventListener('click', () => openEncryptedBackupModal('questions'));
      document.getElementById('qb-restore-btn').addEventListener('click', () => openEncryptedRestoreModal('questions'));

      document.getElementById('qb-filter-source').addEventListener('change', (e) => {
        state.bankFilterSource = e.target.value;
        renderApp();
      });
      document.getElementById('qb-group-by').addEventListener('change', (e) => {
        state.bankGroupBy = e.target.value;
        renderApp();
      });
      document.getElementById('qb-filter-subject').addEventListener('change', (e) => {
        state.bankFilterSubject = e.target.value;
        state.bankFilterTopic = 'ALL';
        renderApp();
      });
      document.getElementById('qb-filter-topic').addEventListener('change', (e) => {
        state.bankFilterTopic = e.target.value;
        renderApp();
      });
      document.getElementById('qb-search').addEventListener('input', (e) => {
        state.bankSearch = e.target.value;
        const pos = e.target.selectionStart;
        renderApp();
        const inp = document.getElementById('qb-search');
        if (inp) {
          inp.focus();
          inp.setSelectionRange(pos, pos);
        }
      });

      document.getElementById('qb-expand-all')?.addEventListener('click', () => {
        state.collapsedSubjects.clear();
        Object.keys(grouped).forEach((subj) => {
          Object.keys(grouped[subj]).forEach((top) => {
            state.expandedTopics.add(subj + '::' + top);
          });
        });
        renderApp();
      });

      document.getElementById('qb-collapse-all')?.addEventListener('click', () => {
        Object.keys(grouped).forEach((subj) => {
          state.collapsedSubjects.add(subj);
        });
        state.expandedTopics.clear();
        renderApp();
      });

          const s = btn.dataset.toggleSubj;
          if (state.collapsedSubjects.has(s)) state.collapsedSubjects.delete(s);
          else state.collapsedSubjects.add(s);
          renderApp();
        });
      });

      main.querySelectorAll('.qb-toggle-topic').forEach((btn) => {
        btn.addEventListener('click', () => {
          const t = btn.dataset.toggleTopic;
          if (state.expandedTopics.has(t)) state.expandedTopics.delete(t);
          else state.expandedTopics.add(t);
          renderApp();
        });
      });

      document.getElementById('qb-select-all').addEventListener('change', (e) => {
        if (e.target.checked) {
          filtered.forEach((q) => state.selectedQuestionIds.add(q.id));
        } else {
          filtered.forEach((q) => state.selectedQuestionIds.delete(q.id));
        }
        renderApp();
      });

      document.getElementById('qb-bulk-delete-btn')?.addEventListener('click', () => {
        const count = state.selectedQuestionIds.size;
        openConfirmModal({
          title: 'Bulk Delete Questions',
          message: `Are you sure you want to permanently delete ${count} selected question(s)?`,
          confirmLabel: `Delete ${count} Question(s)`,
          danger: true,
          onConfirm: () => {
            state.questions = state.questions.filter((q) => !state.selectedQuestionIds.has(q.id));
            state.selectedQuestionIds.clear();
            safeSave(STORAGE_KEYS.QUESTIONS, state.questions);
            showToast(`Deleted ${count} question(s).`, 'success');
            renderApp();
          }
        });
      });

      main.querySelectorAll('.qb-check-item').forEach((chk) => {
        chk.addEventListener('change', (e) => {
          const id = e.target.dataset.id;
          if (e.target.checked) state.selectedQuestionIds.add(id);
          else state.selectedQuestionIds.delete(id);
          renderApp();
        });
      });

      main.querySelectorAll('.qb-edit-btn').forEach((btn) => {
        btn.addEventListener('click', () => openQuestionEditorModal(btn.dataset.id));
      });

      main.querySelectorAll('.qb-del-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          openConfirmModal({
            title: 'Delete Question',
            message: 'Are you sure you want to delete this question from the bank?',
            confirmLabel: 'Delete',
            danger: true,
            onConfirm: () => {
              state.questions = state.questions.filter((q) => q.id !== id);
              state.selectedQuestionIds.delete(id);
              safeSave(STORAGE_KEYS.QUESTIONS, state.questions);
              showToast('Question deleted.', 'success');
              renderApp();
            }
          });
        });
      });

      enhanceRenderedContent(main);
    }

          <div class="space-y-3">
            <div class="text-sm sm:text-base text-slate-900 font-medium">${renderRichText(q.questionText)}</div>
            ${q.imageData ? `
              <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl inline-block">
                <img src="${q.imageData}" alt="Question diagram" class="max-h-48 max-w-full rounded object-contain" />
              </div>
            ` : ''}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${q.options.map((opt, idx) => `

    // =========================================================================
    // PAGE 2: PRACTICE MODE

    function renderMultiTopicPicker(prefix, subject, availableTopics, selectedTopics) {
      const topicCounts = {};
      state.questions.forEach((q) => {
        if (subject !== 'ALL' && q.subject !== subject) return;
        topicCounts[q.topic] = (topicCounts[q.topic] || 0) + 1;
      });
      const isAll = selectedTopics.length === 0;
      return `
        <div>
          <div class="flex items-center justify-between gap-2 mb-2">
            <label class="text-xs font-semibold text-slate-700">Topics <span class="font-normal text-slate-400">(select one or more, or All Topics)</span></label>
            ${selectedTopics.length > 0 ? `<button type="button" id="${prefix}-clear-topics" class="text-xs font-semibold text-indigo-600 hover:underline">Clear (${selectedTopics.length})</button>` : ''}
          </div>
          ${availableTopics.length === 0 ? `
            <div class="text-xs text-slate-400">No topics available for this subject.</div>
          ` : `
            <div class="flex flex-wrap gap-2">
              <button type="button" id="${prefix}-all-topics" class="px-3 py-1.5 rounded-lg border text-xs font-semibold ${isAll ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100'}">

      main.querySelectorAll('.pr-opt-btn').forEach((btn) => {

    // =========================================================================
    // PAGE 3: EXAM MODE (STANDARD CBT ONLINE EXAM PATTERN)
    // =========================================================================
    function clearExamTimer() {
      if (state.exam.timerId) {
        clearInterval(state.exam.timerId);
        state.exam.timerId = null;
      }
    }

    function formatTimer(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function finalizeExam() {
      clearExamTimer();
      const ex = state.exam;
      const cfg = ex.config;
      let correctCount = 0;
      let wrongCount = 0;
      let unattemptedCount = 0;

      const recordedResponses = ex.questions.map((q, idx) => {
        const sel = ex.responses[idx] !== undefined ? ex.responses[idx] : null;
        if (sel === null) unattemptedCount++;
        else if (sel === q.correctIndex) correctCount++;
        else wrongCount++;
        return {
          questionId: q.id,
          questionSnapshot: JSON.parse(JSON.stringify(q)),
          selectedIndex: sel,
          status: ex.statuses[idx] || 'not_visited'
        };
      });

      const score = +(correctCount * cfg.positiveMarks - wrongCount * cfg.negativeMarks).toFixed(2);
      const maxScore = +(ex.questions.length * cfg.positiveMarks).toFixed(2);
      const timeTakenSeconds = Math.max(1, Math.round((Date.now() - ex.startTime) / 1000));

      const resultObj = {
        id: 'exam_' + Date.now(),
        examName: cfg.examName || 'Mock Test',
        date: Date.now(),
        subjectFilter: cfg.subject,
        totalQuestions: ex.questions.length,
        durationMinutes: cfg.durationMinutes,
        timeTakenSeconds,
        correctCount,
        wrongCount,
        unattemptedCount,
        score,
        maxScore,
        positiveMarks: cfg.positiveMarks,
        negativeMarks: cfg.negativeMarks,
        responses: recordedResponses
      };

      state.examHistory.unshift(resultObj);
      safeSave(STORAGE_KEYS.HISTORY, state.examHistory);
      ex.lastResult = resultObj;
      ex.phase = 'result';
      renderApp();
    }
